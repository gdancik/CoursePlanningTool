# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# tests and coverage for backend app

name: backend-app

on:
  push:
    paths: 
      - backend/**
  pull_request:
    paths: 
      - backend/**
  workflow_dispatch:
      
concurrency:
  group: backend

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        GS_CREDENTIALS_JSON: ${{ secrets.GS_CREDENTIALS_JSON }}
      run: |
        pytest backend/tests/app/
    - name: Show code coverage
      env:
        GS_CREDENTIALS_JSON: ${{ secrets.GS_CREDENTIALS_JSON }}
      run: |
        pytest --cov=backend/ --cov-report=term-missing --cov-report=term-missing backend/tests/app/      
        # pytest --cov --cov-config=.coveragerc --cov-branch --cov-report=html --cov-report=term-missing tests_python 
