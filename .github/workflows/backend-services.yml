# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# tests and coverage for backend-end services

name: backend-services

on:
  push:
    paths: 
      - backend/services/*
      - backend/tests/services/
  pull_request:
    paths: 
      - backend/services/*
      - backend/tests/services/
  workflow_dispatch:

concurrency:
  group: backend
      
permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name !=
        github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.x"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test code and show coverage
      env:
        GS_CREDENTIALS_JSON: ${{ secrets.GS_CREDENTIALS_JSON }}
      run: |
        pytest --cov=backend/services --cov-report=term-missing backend/tests/services/      
        # pytest --cov --cov-config=.coveragerc --cov-branch --cov-report=html --cov-report=term-missing tests_python 
